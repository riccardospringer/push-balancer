apiVersion: v1
kind: Service
metadata:
  name: {{ include "push-balancer.fullname" . }}
  labels:
    {{- include "push-balancer.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.service.portName | default (printf "http-%v" .Values.service.port) }}
  selector:
    {{- include "push-balancer.selectorLabels" . | nindent 4 }}
